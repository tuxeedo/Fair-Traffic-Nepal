services:
  - type: web
    name: fairtraffic-backend
    env: python
    plan: free
    buildCommand: "./backend/build.sh"
    startCommand: "gunicorn --chdir backend fairtraffic.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fairtraffic-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Set this to your Vercel frontend URL after deployment, e.g.:
      # https://fair-traffic-nepal.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fair-traffic-nepal.vercel.app"

databases:
  - name: fairtraffic-db
    databaseName: fairtraffic
    user: fairtraffic_user
    plan: free
