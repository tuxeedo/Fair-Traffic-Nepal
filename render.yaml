services:
  - type: web
    name: fairtraffic-backend
    env: python
    plan: free
    buildCommand: "./backend/build.sh"
    startCommand: "gunicorn --chdir backend fairtraffic.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fairtraffic-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

databases:
  - name: fairtraffic-db
    databaseName: fairtraffic
    user: fairtraffic_user
    plan: free
