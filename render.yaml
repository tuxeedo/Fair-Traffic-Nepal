services:
  - type: web
    name: fairtraffic-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && (python seed_government_registry.py || true) && (python create_demo_rules.py || true) && (python create_demo_users.py || true)"
    startCommand: "gunicorn --chdir backend fairtraffic.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fairtraffic-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: fairtraffic-db
    databaseName: fairtraffic
    user: fairtraffic_user
    plan: free
